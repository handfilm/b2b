name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Vite application
        run: npm run build

      - name: Ensure CNAME in dist
        run: |
          if [ -f CNAME ]; then cp CNAME dist/CNAME; fi
          if [ -f public/404.html ]; then cp public/404.html dist/404.html; fi

      # Option 1: GitHub Actions deployment (when Settings -> Pages -> Source is set to 'GitHub Actions')
      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages via Actions
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # Option 2: Fallback gh-pages branch deployment (in case user keeps 'Deploy from a branch')
      - name: Deploy to gh-pages branch fallback
        uses: JamesIves/github-pages-deploy-action@v4
        continue-on-error: true
        with:
          folder: dist
          branch: gh-pages

